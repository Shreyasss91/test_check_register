name: Build Meter Inspection APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Verify generated APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name '*.apk' -print
          APK_COUNT=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi
          if [ "$APK_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple APKs were generated; refusing to guess which one to upload."
            exit 1
          fi
          APK_PATH=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          echo "APK_PATH=$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meter-inspection-apk
          path: ${{ github.workspace }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
