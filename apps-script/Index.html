<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Meter Inspection Register</title>
  <style>
    :root { --blue:#1a73e8; --bg:#f1f3f4; --card:#fff; --err:#d93025; --ok:#188038;
            --text:#202124; --muted:#5f6368; --faint:#9aa0a6; --line:#dadce0;
            --accent:#e8f0fe; --accentText:#1a56c5; --warnBg:#fef7e0; --warnText:#7a5b00; --warnLine:#f0e0a0;
            --toastOkBg:#e6f4ea; --toastErrBg:#fce8e6; }
    body.dark { --bg:#0f1216; --card:#1b1f26; --text:#f1f3f4; --muted:#b3bac2; --faint:#8a9199;
            --line:#3a4048; --blue:#8ab4f8; --err:#f28b82; --ok:#81c995;
            --accent:#25303e; --accentText:#c8dcff; --warnBg:#3a3220; --warnText:#f8d47a; --warnLine:#5a4a1e;
            --toastOkBg:#243a2c; --toastErrBg:#4a2521; }
    * { box-sizing:border-box; font-family:Roboto,Arial,sans-serif; }
    body { margin:0; background:var(--bg); color:var(--text); padding-bottom:86px; }
    header { background:var(--blue); color:var(--card); padding:12px 16px; position:sticky; top:0; z-index:5;
             display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; flex:1; font-weight:500; }
    .chip { background:rgba(255,255,255,.2); border-radius:14px; padding:3px 10px; font-size:12px; }
    #net { border-radius:14px; padding:3px 10px; font-size:12px; cursor:default; }
    .on  { background:#c6efce; color:#145a32; }
    .off { background:#ffd7cf; color:#8b1e11; }
    #theme { cursor:pointer; user-select:none; }
    main { padding:12px; max-width:520px; margin:0 auto; }
    .card { background:var(--card); border-radius:10px; padding:14px; margin-bottom:12px;
            box-shadow:0 1px 2px rgba(0,0,0,.12); }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; font-weight:500; }
    input, textarea, select { width:100%; padding:10px; font-size:15px; border:1px solid var(--line);
              border-radius:6px; background:var(--card); color:var(--text); }
    select { -webkit-appearance:none; appearance:none;
             background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
             background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px,5px 5px;
             background-repeat:no-repeat; padding-right:34px; }
    select option { background:var(--card); color:var(--text); }
    input:focus { outline:2px solid var(--blue); border-color:transparent; }
    .row { display:flex; gap:10px; } .row > div { flex:1; }
    label small.hint { font-weight:400; color:var(--faint); font-size:11px; }
    .grid6 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    details { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
    summary { cursor:pointer; font-size:13px; color:var(--blue); font-weight:500; }
    #meterInfo { display:none; margin-top:8px; font-size:13px; background:var(--accent); color:var(--accentText);
                 border-radius:6px; padding:8px 10px; line-height:1.5; }
    button.submit { position:fixed; bottom:0; left:0; right:0; width:100%; border:none;
            background:var(--blue); color:var(--card); font-size:17px; padding:17px; cursor:pointer; }
    button.submit:disabled { opacity:.6; }
    #toast { position:fixed; top:56px; left:50%; transform:translateX(-50%); min-width:260px;
             max-width:92vw; padding:11px 16px; border-radius:8px; display:none; z-index:20;
             font-size:14px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.25); }
    .t-ok { background:var(--toastOkBg); color:var(--ok); } .t-err { background:var(--toastErrBg); color:var(--err); }
    .center { text-align:center; padding:40px 20px; color:var(--muted); }
    .ver { text-align:center; font-size:11px; color:var(--faint); margin:2px 0 8px; }
    small.req { color:var(--err); }
    #guestBar { display:none; background:var(--warnBg); color:var(--warnText); font-size:12px;
                padding:8px 12px; line-height:1.5; border-bottom:1px solid var(--warnLine); }
    #queueBar { display:none; background:var(--warnBg); color:var(--warnText); font-size:13px;
                padding:8px 16px; text-align:center; cursor:pointer; }
    #queueBar, #guestBar { border-color:var(--warnLine); }
    /* native bits that ignore CSS variables: keep them light in dark mode */
    body.dark #net.on  { background:#1d3325; color:#81c995; }
    body.dark #net.off { background:#3d221e; color:#f28b82; }
    body.dark .chip { background:rgba(0,0,0,.3); }
    body.dark header { color:#0f1216; }
  </style>
</head>
<body>

<header>
  <h1>Meter Inspection</h1>
  <span class="chip" id="who">…</span>
  <span id="net" class="chip on">online</span>
  <span id="theme" class="chip" onclick="toggleTheme()" title="Toggle light / dark">☾</span>
</header>
<div id="guestBar"></div>
<div id="queueBar" onclick="syncQueue(true)">⚠ <span id="qCount">0</span> saved offline — tap to send<span id="failedNote" style="display:none"> · <span id="fCount">0</span> rejected — tap to retry</span></div>

<main id="app">
  <div class="center" id="loading">Loading…</div>
</main>

<div id="toast"></div>
<button class="submit" id="btn" style="display:none" onclick="onSubmit()">Submit inspection</button>

<script>
  var QKEY = 'mrq_v1', CONFIG_LISTS = {}, IS_GUEST = false, NO_EMAIL = false, submitting = false;
  var TKEY = 'mr_theme';

  /* ---------- theme (dark mode for outdoor sunlight/shade use) ---------- */
  function applyTheme(dark) {
    document.body.classList.toggle('dark', !!dark);
    var t = document.getElementById('theme');
    if (t) t.textContent = dark ? '☀' : '☾';
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.setAttribute('content', dark ? 'dark' : 'light');
    else {
      meta = document.createElement('meta');
      meta.name = 'color-scheme'; meta.content = dark ? 'dark' : 'light';
      document.head.appendChild(meta);
    }
  }
  function toggleTheme() {
    var dark = !document.body.classList.contains('dark');
    try { localStorage.setItem(TKEY, dark ? 'dark' : 'light'); } catch (e) {}
    applyTheme(dark);
  }
  // restore before first paint of the app body to avoid a light flash
  (function () {
    var saved = null;
    try { saved = localStorage.getItem(TKEY); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    applyTheme(dark);
  })();

  /* ---------- boot ---------- */
  window.onload = function () {
    updateNet();
    setInterval(tick, 30000);
    window.addEventListener('online', function(){ updateNet(); syncQueue(); });
    window.addEventListener('offline', updateNet);
    refreshNetBadge();

    google.script.run
      .withSuccessHandler(onBoot)
      .withFailureHandler(failBoot)
      .getBootstrap();
  };

  function onBoot(r) {
    if (!r || !r.ok) {
      document.getElementById('loading').textContent =
        r && r.reason === 'not_authorized'
          ? 'Your e-mail is in the Team tab but the Name column is empty. Ask the consolidator to fill it in.'
          : ('Error: ' + ((r && r.reason) || 'unknown'));
      return;
    }
    IS_GUEST = !!r.user.guest;
    NO_EMAIL = !!r.user.noEmail;
    document.getElementById('who').textContent =
      IS_GUEST ? (r.user.name || 'guest') + (NO_EMAIL ? ' (no email)' : ' (not in Team)') : r.user.name;
    document.getElementById('who').textContent =
      IS_GUEST ? (r.user.name || 'guest') + ' (not in Team)' : r.user.name;
    CONFIG_LISTS = r.configLists || {};

    var statusList = r.meterStatuses || CONFIG_LISTS['Meter Status'] || ['OK'];
    var extraLists = [];
    Object.keys(CONFIG_LISTS).forEach(function (h) {
      if (h !== 'Meter Status') extraLists.push({ header: h, values: CONFIG_LISTS[h] });
    });
    var extraCard = '';
    if (extraLists.length) {
      extraCard = '<div class="card"><label>Additional details (optional)</label><div class="grid6">';
      extraLists.forEach(function (d) {
        var id = 'cfg_' + normKey(d.header);
        extraCard += '<div><label>' + esc(d.header) + '</label>' +
          '<select id="' + id + '"><option value="">—</option></select></div>';
      });
      extraCard += '</div></div>';
    }
    var guestCard = '';
    if (IS_GUEST) {
      var gb = document.getElementById('guestBar');
      if (NO_EMAIL) {
        gb.innerHTML = 'ℹ You are <b>not logged into a Google account</b> in this browser, so your e-mail is unavailable. ' +
          'No problem — type your name below and submit; entries are recorded as <b>Your name (no email)</b>. ' +
          'Logging into Google and reloading records future entries against your e-mail instead.';
      } else {
        gb.innerHTML = 'ℹ You are <b>not in the Team list</b> yet (' + esc(r.user.email) + '). ' +
          'You can still submit — entries are recorded as <b>Your name{' + esc(r.user.email) + '}</b> ' +
          'until the admin adds you. Ask them to add your e-mail to the Team tab.';
      }
      gb.style.display = 'block';
      guestCard = '<div class="card">' +
        '<label>Your name <small class="req">*</small> (required while not in Team)</label>' +
        '<input id="guestName" autocomplete="name" maxlength="60" placeholder="as it should appear in the register" value="' +
          esc(r.user.name || '') + '">' +
      '</div>';
    }
    document.getElementById('app').innerHTML =
      guestCard +
      '<div class="card">' +
        '<div class="row">' +
          '<div><label>RR Number</label>' +
           '<input id="rr" autocomplete="off" placeholder="type RR number"></div>' +
          '<div><label>Account ID</label>' +
           '<input id="acct" autocomplete="off" placeholder="either one is enough"></div>' +
        '</div>' +
        '<div id="meterInfo"></div>' +
        '<details><summary>Meter details (optional – edit what you see at the spot)</summary><div class="grid6">' +
          '<div><label>Constant</label><input id="mdConstant" autocomplete="off"></div>' +
          '<div><label>Make</label><input id="mdMake" autocomplete="off"></div>' +
          '<div><label>Serial No</label><input id="mdSerial" autocomplete="off"></div>' +
          '<div><label>Phases</label><input id="mdPhases" autocomplete="off"></div>' +
          '<div><label>DTC</label><input id="mdDtc" autocomplete="off"></div>' +
          '<div><label>Feeder</label><input id="mdFeeder" autocomplete="off"></div>' +
          '<div><label>Location</label><input id="mdLocation" autocomplete="off"></div>' +
        '</div></details>' +
      '</div>' +

      '<div class="card">' +
        '<label>Reading CKWh <small class="req">*</small></label>' +
        '<input type="number" id="ckwh" step="0.01" min="0" inputmode="decimal">' +
        '<details><summary>Block readings – B1…B6 kWh (optional)</summary><div class="grid6">' +
          bInputs('bk', 6) + '</div></details>' +
        '<div class="row">' +
          '<div><label>Reading Pr kW <small class="req">*</small></label>' +
           '<input type="number" id="prk" step="0.01" min="0" inputmode="decimal"></div>' +
          '<div><label>B1 kW demand <small class="req">*</small></label>' +
           '<input type="number" id="bw1" step="0.01" min="0" inputmode="decimal" required></div>' +
        '</div>' +
        '<details><summary>Block demand – B2…B6 kW (optional)</summary><div class="grid6">' +
          (function(){var s='';for(var i=2;i<=6;i++) s+='<div><label>B'+i+'</label><input type="number" step="0.01" min="0" inputmode="decimal" id="bw'+i+'"></div>';return s;})() + '</div></details>' +
        '<div class="row">' +
          '<div><label>PF (0–1)</label>' +
           '<input type="number" id="pf" step="0.01" min="0" max="1" inputmode="decimal"></div>' +
          '<div><label>Meter status</label>' +
           '<select id="status"></select></div>' +
        '</div>' +
      '</div>' +
      extraCard +
      '<div class="card"><label>Remarks (optional)</label>' +
      '<textarea id="remarks" rows="2" maxlength="200"></textarea></div>' +
      '<div class="ver" id="ver"></div>';

    document.getElementById('rr').addEventListener('input', onRR);
    document.getElementById('acct').addEventListener('input', onRR);
    wireEnterAdvance();
    if (r.version) document.getElementById('ver').textContent = 'Meter Register ' + r.version;

    var sel = document.getElementById('status');
    statusList.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s; o.textContent = s;
      sel.appendChild(o);
    });
    sel.value = statusList[0]; // first value in the sheet = default
    extraLists.forEach(function (d) {
      var es = document.getElementById('cfg_' + normKey(d.header));
      if (!es) return;
      d.values.forEach(function (v) {
        var o = document.createElement('option');
        o.value = v; o.textContent = v;
        es.appendChild(o);
      });
    });
    document.getElementById('btn').style.display = 'block';
    renderQ();
  }

  function failBoot(e) {
    document.getElementById('loading').textContent =
      'Could not reach server' + (navigator.onLine ? '' : ' (offline)') +
      '. Reconnect and reload.';
  }

  /* ---------- faster entry flow ---------- */

  /* Enter (and the keyboard's Next/Go action) jumps to the next field in
     reading order, so an inspector can walk the meter top-to-bottom
     without reaching for the mouse. From the last required field (Meter
     status) Enter submits; the optional details/remarks sections are
     skipped on the main path — Enter from RR goes straight to CKWh. */
  var ENTRY_FLOW = [
    'rr', 'acct', 'ckwh', 'prk', 'bw1', 'pf', 'status'
  ];

  function wireEnterAdvance() {
    for (var i = 0; i < ENTRY_FLOW.length; i++) {
      (function (id, idx) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('keydown', function (ev) {
          if (ev.key !== 'Enter' || ev.shiftKey || ev.ctrlKey || ev.altKey || ev.metaKey) return;
          ev.preventDefault(); // stop form-gesture side effects (e.g. iOS Go blurring away)
          // 'change' commits select/number-spinner state before moving on
          el.blur();
          if (idx + 1 >= ENTRY_FLOW.length) {
            onSubmit(); // last field in the flow = submit
          } else {
            var nx = document.getElementById(ENTRY_FLOW[idx + 1]);
            if (nx) { nx.focus(); try { nx.select && nx.select(); } catch (e) {} }
          }
        });
      })(ENTRY_FLOW[i], i);
    }
  }

  function bInputs(pre, n) {
    var s = '';
    for (var i = 1; i <= n; i++)
      s += '<div><label>B' + i + '</label>' +
           '<input type="number" step="0.01" min="0" inputmode="decimal" id="' + pre + i + '"></div>';
    return s;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // matches the server-side normalizeKey_(): letters/digits only, lowercased
  function normKey(s) { return String(s || '').replace(/[^a-z0-9]/gi, '').toLowerCase(); }

  /* Meter resolution is server-side (Master holds 15-30k rows — shipping
     it to the browser was megabytes and slow). onRR debounces keystrokes,
     asks lookupMeter for whichever field changed, and ignores responses
     that no longer match the current input (stale replies). */
  var rrTimer = null, rrSeq = 0, rrShown = 0, lastMeter = null, meterCache = {};

  function onRR() {
    var rrV = document.getElementById('rr').value.trim();
    var acV = document.getElementById('acct').value.trim();
    var q = rrV || acV;
    var box = document.getElementById('meterInfo');

    if (!q) { box.style.display = 'none'; lastMeter = null; return; }
    if (meterCache[normKey(q)]) { showMeter(meterCache[normKey(q)]); return; }

    box.style.display = 'block';
    box.textContent = 'Looking up ' + q + '…';
    box.style.whiteSpace = 'pre-line';

    if (rrTimer) clearTimeout(rrTimer);
    rrTimer = setTimeout(function () {
      var seq = ++rrSeq;
      var asked = normKey(q);
      google.script.run
        .withSuccessHandler(function (r) {
          if (seq !== rrSeq) return; // user kept typing - ignore the stale reply
          var rrNow = document.getElementById('rr').value.trim();
          var acNow = document.getElementById('acct').value.trim();
          var qNow = rrNow || acNow;
          if (normKey(qNow) !== asked) return; // input changed mid-flight
          if (!r || !r.ok || !r.meter) {
            meterCache[asked] = null;
            box.textContent = 'No meter found for "' + q + '" — check the number or add it to Master.';
            lastMeter = null;
            return;
          }
          meterCache[asked] = r.meter;
          showMeter(r.meter);
        })
        .withFailureHandler(function (e) {
          if (seq !== rrSeq) return;
          box.textContent = 'Lookup failed (' + (e && e.message || 'network') + ') — you can still submit; the server re-checks.';
          lastMeter = null;
        })
        .lookupMeter(q);
    }, 300);
  }

  function showMeter(m) {
    var box = document.getElementById('meterInfo');
    // presentation order (1 field-line per request):
    //   1 Name, Acct  ·  2 Tariff, Sanc kW/HP, Cont.Demand
    //   3 MR ID, MR DAY, SF  ·  4 Constant, Status, DOS, Make, Phases
    box.textContent =
      'Name: ' + (m.name || '—') + ' · Acct: ' + (m.accountId || '—') +
      '\nTariff: ' + (m.tariff || '—') + ' · SANC: ' + (m.sancKw || '—') + ' kW / ' +
      (m.sancHp || '—') + ' HP · Cont.Demand: ' + (m.contDem || '—') +
      '\nMR ID: ' + (m.mrid || '—') + ' · MR DAY: ' + (m.mdDay || '—') + ' · SF: ' + (m.sf || '—') +
      '\nConstant: ' + (m.constant || '—') + ' · Status: ' + (m.status || '—') +
      ' · DOS: ' + (m.dos || '—') + ' · Make: ' + (m.make || '—') +
      ' · Phases: ' + (m.phases || '—') +
      (m.dtc || m.feeder || m.spot ? '\nDTC: ' + (m.dtc || '—') +
        ' · Feeder: ' + (m.feeder || '—') + ' · Location: ' + (m.spot || '—') : '');
    box.style.whiteSpace = 'pre-line';
    box.style.display = 'block';
    // pre-fill the optional meter-details section from Master (overwrites when
    // the resolved meter changes; leaves the inspector's own edits alone)
    if (lastMeter !== m.rr) {
      lastMeter = m.rr;
      setVal('mdConstant', m.constant, true); setVal('mdMake', m.make, true);
      setVal('mdSerial', m.serial, true); setVal('mdPhases', m.phases, true);
      setVal('mdDtc', m.dtc, true); setVal('mdFeeder', m.feeder, true);
      setVal('mdLocation', m.spot, true);
    }
  }

  function setVal(id, v, force) {
    var el = document.getElementById(id);
    if (el && (force || !el.value)) el.value = v || '';
  }

  /* ---------- submit ---------- */
  function onSubmit() {
    if (submitting) return;
    var p = collect();
    if (!p) return;

    if (!navigator.onLine) {
      enqueue(p);
      toast('Saved on phone ✓ will send automatically — form cleared for next entry', true);
      resetReadings();
      return;
    }

    submitting = true; btn(true);
    google.script.run
      .withSuccessHandler(function (r) {
        submitting = false; btn(false);
        if (r && r.ok) {
          toast('Saved ✓ row ' + r.row + ' (' + r.month + ') — form cleared for next entry' +
                (r.warnings.length ? ' ⚠ ' + r.warnings.join(' · ') : '') +
                (r.capacity ? ' ⚠ ' + r.capacity : ''), !(r.warnings.length || r.capacityCritical));
          resetReadings();
        } else toast((r && r.error) || 'Failed', false);
      })
      .withFailureHandler(function (e) {
        submitting = false; btn(false);
        toast('Send failed: ' + e.message + ' — saved on phone, form cleared', true);
        enqueue(p);
        resetReadings();
      })
      .submitEntry(p);
  }

  function collect() {
    var g = function (id) { return document.getElementById(id).value.trim(); };
    // Date/Time are captured silently from the device clock at submit — no UI for these.
    var n = new Date();
    var p = {
      date: localISO(n),
      time: pad(n.getHours()) + ':' + pad(n.getMinutes()),
      rr: g('rr'), accountId: g('acct'), ckwh: g('ckwh'), prk: g('prk'),
      pf: g('pf'), status: g('status'), remarks: g('remarks'),
      meterDetails: {
        constant: g('mdConstant'), make: g('mdMake'), serial: g('mdSerial'),
        phases: g('mdPhases'), dtc: g('mdDtc'), feeder: g('mdFeeder'),
        location: g('mdLocation')
      },
      blocksKwh: [], bkw: []
    };
    for (var i = 1; i <= 6; i++) {
      p.blocksKwh.push(g('bk' + i));
      p.bkw.push(g('bw' + i));
    }
    // extra config dropdowns (Configuration tab columns) - header: value
    var config = {};
    Object.keys(CONFIG_LISTS).forEach(function (h) {
      if (h === 'Meter Status') return;
      var el = document.getElementById('cfg_' + normKey(h));
      if (el && el.value) config[h] = el.value;
    });
    if (Object.keys(config).length) p.config = config;
    if (!p.rr && !p.accountId) return err('Enter RR Number or Account ID');
    if (p.ckwh === '') return err('CKWh reading is required');
    if (p.prk === '')  return err('Pr kW reading is required');
    if (p.bkw[0] === '') return err('B1 kW is required');
    if (IS_GUEST) {
      var gEl = document.getElementById('guestName');
      if (gEl) p.guestName = gEl.value.trim();
      if (!p.guestName) return err('Enter your name — you are not in the Team list yet');
      if (/[{}]/.test(p.guestName)) return err('Name cannot contain { or }');
      if (NO_EMAIL && normKey(p.guestName) === 'noemail') return err('That name is reserved — enter your real name');
    }
    return p;
  }

  function err(msg) { toast(msg, false); return null; }
  function btn(d) { document.getElementById('btn').disabled = d; }

  // clears every input for the next inspection; Date/Time are captured fresh at the next Submit
  function resetReadings() {
    ['ckwh','prk','pf','remarks','rr','acct','mdConstant','mdMake','mdSerial','mdPhases','mdDtc','mdFeeder','mdLocation']
      .forEach(function (id) { document.getElementById(id).value = ''; });
    var st = document.getElementById('status');
    if (st && st.options.length) st.value = st.options[0].value; // sheet default
    lastMeter = null;
    // extra config dropdowns back to their "—" placeholder
    Object.keys(CONFIG_LISTS).forEach(function (h) {
      if (h === 'Meter Status') return;
      var el = document.getElementById('cfg_' + normKey(h));
      if (el) el.value = '';
    });
    for (var i = 1; i <= 6; i++) {
      document.getElementById('bk' + i).value = '';
      document.getElementById('bw' + i).value = '';
    }
    document.getElementById('meterInfo').style.display = 'none';
  }

  /* ---------- offline queue ---------- */
  var QFKEY = 'mrq_failed_v1';
  function qGet() { try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch (e) { return []; } }
  function qSet(q) { localStorage.setItem(QKEY, JSON.stringify(q)); renderQ(); }
  function qFailGet() { try { return JSON.parse(localStorage.getItem(QFKEY)) || []; } catch (e) { return []; } }
  function qFailSet(q) { localStorage.setItem(QFKEY, JSON.stringify(q)); renderQ(); }

  function enqueue(p) { var q = qGet(); q.push({ at: new Date().toISOString(), p: p }); qSet(q); }

  // send failed entries first (manual retry via bar tap), then the live queue.
  // a server-REJECTED entry is parked in the failed list so it never blocks
  // the rest of the queue (poison pill), and is visible in the yellow bar.
  function syncQueue(retryFailed) {
    if (!navigator.onLine || submitting) return;
    if (retryFailed) {
      var fq = qFailGet();
      if (fq.length) { qFailSet(fq.slice(1).concat(qGet())); qSet([]); }
    }
    var q = qGet();
    if (!q.length) return;
    submitting = true;
    var item = q[0];
    google.script.run
      .withSuccessHandler(function (r) {
        submitting = false;
        if (r && r.ok) {
          q.shift(); qSet(q);
          toast('Sent 1 saved entry ✓', true);
          if (q.length) syncQueue();
        } else {
          var bad = q.shift(); // park the rejected entry — don't block the rest
          qSet(q);
          var fq = qFailGet();
          fq.push({ at: new Date().toISOString(), p: bad.p, why: (r && r.error) || 'rejected' });
          qFailSet(fq);
          toast('Rejected: ' + ((r && r.error) || 'saved separately'), false);
          if (q.length) syncQueue();
        }
      })
      .withFailureHandler(function () { submitting = false; }) // still offline - retry later
      .submitEntry(item.p);
  }

  function tick() {
    refreshNetBadge(); syncQueue();
  }

  function renderQ() {
    var q = qGet(), fq = qFailGet(), bar = document.getElementById('queueBar');
    var total = q.length + fq.length;
    bar.style.display = total ? 'block' : 'none';
    document.getElementById('qCount').textContent = q.length + (fq.length ? '+' + fq.length + ' held' : '');
    var note = document.getElementById('failedNote');
    note.style.display = fq.length ? 'inline' : 'none';
    document.getElementById('fCount').textContent = fq.length;
  }

  /* ---------- misc ---------- */
  function refreshNetBadge() {
    var el = document.getElementById('net');
    el.textContent = navigator.onLine ? 'online' : 'offline';
    el.className = 'chip ' + (navigator.onLine ? 'on' : 'off');
  }
  function updateNet() {}
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function localISO(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  var tTimer;
  function toast(msg, isOk) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isOk ? 't-ok' : 't-err';
    t.style.display = 'block';
    clearTimeout(tTimer);
    tTimer = setTimeout(function () { t.style.display = 'none'; }, isOk ? 4000 : 7000);
  }
</script>
</body>
</html>
