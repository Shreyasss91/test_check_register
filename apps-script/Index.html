<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Meter Inspection Register</title>
  <style>
    :root { --blue:#1a73e8; --bg:#f1f3f4; --card:#fff; --err:#d93025; --ok:#188038; }
    * { box-sizing:border-box; font-family:Roboto,Arial,sans-serif; }
    body { margin:0; background:var(--bg); color:#202124; padding-bottom:86px; }
    header { background:var(--blue); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:5;
             display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; flex:1; font-weight:500; }
    .chip { background:rgba(255,255,255,.2); border-radius:14px; padding:3px 10px; font-size:12px; }
    #net { border-radius:14px; padding:3px 10px; font-size:12px; cursor:default; }
    .on  { background:#c6efce; color:#145a32; }
    .off { background:#ffd7cf; color:#8b1e11; }
    main { padding:12px; max-width:520px; margin:0 auto; }
    .card { background:var(--card); border-radius:10px; padding:14px; margin-bottom:12px;
            box-shadow:0 1px 2px rgba(0,0,0,.12); }
    label { display:block; font-size:12px; color:#5f6368; margin:10px 0 4px; font-weight:500; }
    input, textarea, select { width:100%; padding:10px; font-size:15px; border:1px solid #dadce0;
              border-radius:6px; background:#fff; }
    input:focus { outline:2px solid var(--blue); border-color:transparent; }
    .row { display:flex; gap:10px; } .row > div { flex:1; }
    .grid6 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    details { margin-top:10px; border-top:1px dashed #dadce0; padding-top:8px; }
    summary { cursor:pointer; font-size:13px; color:var(--blue); font-weight:500; }
    #meterInfo { display:none; margin-top:8px; font-size:13px; background:#e8f0fe;
                 border-radius:6px; padding:8px 10px; line-height:1.5; }
    button.submit { position:fixed; bottom:0; left:0; right:0; width:100%; border:none;
            background:var(--blue); color:#fff; font-size:17px; padding:17px; cursor:pointer; }
    button.submit:disabled { opacity:.6; }
    #toast { position:fixed; top:56px; left:50%; transform:translateX(-50%); min-width:260px;
             max-width:92vw; padding:11px 16px; border-radius:8px; display:none; z-index:20;
             font-size:14px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.25); }
    .t-ok { background:#e6f4ea; color:var(--ok); } .t-err { background:#fce8e6; color:var(--err); }
    .center { text-align:center; padding:40px 20px; color:#5f6368; }
    .ver { text-align:center; font-size:11px; color:#9aa0a6; margin:2px 0 8px; }
    small.req { color:var(--err); }
    #guestBar { display:none; background:#fef7e0; color:#7a5b00; font-size:12px;
                padding:8px 12px; line-height:1.5; border-bottom:1px solid #f0e0a0; }
    #queueBar { display:none; background:#fef7e0; color:#7a5b00; font-size:13px;
                padding:8px 16px; text-align:center; cursor:pointer; }
  </style>
</head>
<body>

<header>
  <h1>Meter Inspection</h1>
  <span class="chip" id="who">…</span>
  <span id="net" class="chip on">online</span>
</header>
<div id="guestBar"></div>
<div id="queueBar" onclick="syncQueue(true)">⚠ <span id="qCount">0</span> saved offline — tap to send<span id="failedNote" style="display:none"> · <span id="fCount">0</span> rejected — tap to retry</span></div>

<main id="app">
  <div class="center" id="loading">Loading…</div>
</main>

<div id="toast"></div>
<button class="submit" id="btn" style="display:none" onclick="onSubmit()">Submit inspection</button>

<script>
  var METERS = {}, QKEY = 'mrq_v1', CONFIG_LISTS = {}, IS_GUEST = false, submitting = false;

  /* ---------- boot ---------- */
  window.onload = function () {
    updateNet();
    setInterval(tick, 30000);
    window.addEventListener('online', function(){ updateNet(); syncQueue(); });
    window.addEventListener('offline', updateNet);
    refreshNetBadge();

    google.script.run
      .withSuccessHandler(onBoot)
      .withFailureHandler(failBoot)
      .getBootstrap();
  };

  function onBoot(r) {
    if (!r || !r.ok) {
      document.getElementById('loading').textContent =
        r && r.reason === 'not_authorized'
          ? 'No login e-mail available. Open this form while logged into your Google account.'
          : ('Error: ' + ((r && r.reason) || 'unknown'));
      return;
    }
    IS_GUEST = !!r.user.guest;
    document.getElementById('who').textContent =
      IS_GUEST ? (r.user.name || 'guest') + ' (not in Team)' : r.user.name;
    CONFIG_LISTS = r.configLists || {};
    r.meters.forEach(function (m) {
      METERS[normKey(m.rr)] = m;
      if (m.accountId) METERS[normKey(m.accountId)] = m;
    });

    var dlsRR = document.createElement('datalist'); dlsRR.id = 'rrList';
    var dlsAC = document.createElement('datalist'); dlsAC.id = 'acList';
    r.meters.forEach(function (m) {
      var o = document.createElement('option');
      o.value = m.rr; o.label = m.name ? m.name + ' · ' + m.make : m.make;
      dlsRR.appendChild(o);
      if (m.accountId) {
        var oa = document.createElement('option');
        oa.value = m.accountId; oa.label = m.name ? m.name + ' · ' + m.make : m.make;
        dlsAC.appendChild(oa);
      }
    });
    document.body.appendChild(dlsRR);
    document.body.appendChild(dlsAC);

    var today = localISO(new Date());
    var now = new Date();
    var statusList = r.meterStatuses || CONFIG_LISTS['Meter Status'] || ['OK'];
    var extraLists = [];
    Object.keys(CONFIG_LISTS).forEach(function (h) {
      if (h !== 'Meter Status') extraLists.push({ header: h, values: CONFIG_LISTS[h] });
    });
    var extraCard = '';
    if (extraLists.length) {
      extraCard = '<div class="card"><label>Additional details (optional)</label><div class="grid6">';
      extraLists.forEach(function (d) {
        var id = 'cfg_' + normKey(d.header);
        extraCard += '<div><label>' + esc(d.header) + '</label>' +
          '<select id="' + id + '"><option value="">—</option></select></div>';
      });
      extraCard += '</div></div>';
    }
    var guestCard = '';
    if (IS_GUEST) {
      var gb = document.getElementById('guestBar');
      gb.innerHTML = 'ℹ You are <b>not in the Team list</b> yet (' + esc(r.user.email) + '). ' +
        'You can still submit — entries are recorded as <b>Your name{' + esc(r.user.email) + '}</b> ' +
        'until the admin adds you. Ask them to add your e-mail to the Team tab.';
      gb.style.display = 'block';
      guestCard = '<div class="card">' +
        '<label>Your name <small class="req">*</small> (required while not in Team)</label>' +
        '<input id="guestName" autocomplete="name" maxlength="60" placeholder="as it should appear in the register" value="' +
          esc(r.user.name || '') + '">' +
      '</div>';
    }
    document.getElementById('app').innerHTML =
      guestCard +
      '<div class="card">' +
        '<div class="row">' +
          '<div><label>Date</label><input type="date" id="date" value="' + today + '"></div>' +
          '<div><label>Time</label><input type="time" id="time" value="' +
            pad(now.getHours()) + ':' + pad(now.getMinutes()) + '"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div><label>RR Number</label>' +
          '<input list="rrList" id="rr" autocomplete="off" placeholder="pick or type"></div>' +
          '<div><label>Account ID</label>' +
          '<input list="acList" id="acct" autocomplete="off" placeholder="either one is enough"></div>' +
        '</div>' +
        '<div id="meterInfo"></div>' +
        '<details><summary>Meter details (optional – edit what you see at the spot)</summary><div class="grid6">' +
          '<div><label>Constant</label><input id="mdConstant" autocomplete="off"></div>' +
          '<div><label>Make</label><input id="mdMake" autocomplete="off"></div>' +
          '<div><label>Serial No</label><input id="mdSerial" autocomplete="off"></div>' +
          '<div><label>Phases</label><input id="mdPhases" autocomplete="off"></div>' +
          '<div><label>DTC</label><input id="mdDtc" autocomplete="off"></div>' +
          '<div><label>Feeder</label><input id="mdFeeder" autocomplete="off"></div>' +
          '<div><label>Location</label><input id="mdLocation" autocomplete="off"></div>' +
        '</div></details>' +
      '</div>' +

      '<div class="card">' +
        '<label>Reading CKWh <small class="req">*</small></label>' +
        '<input type="number" id="ckwh" step="0.01" min="0" inputmode="decimal">' +
        '<details><summary>Block readings – B1…B6 kWh (optional)</summary><div class="grid6">' +
          bInputs('bk', 6) + '</div></details>' +
        '<label>Reading Pr kW <small class="req">*</small></label>' +
        '<input type="number" id="prk" step="0.01" min="0" inputmode="decimal">' +
        '<details><summary>Block demand – B1…B6 kW (optional)</summary><div class="grid6">' +
          bInputs('bw', 6) + '</div></details>' +
        '<label>PF (0–1)</label>' +
        '<input type="number" id="pf" step="0.01" min="0" max="1" inputmode="decimal">' +
        '<label>Meter status</label>' +
        '<select id="status"></select>' +
      '</div>' +
      extraCard +
      '<div class="card"><label>Remarks (optional)</label>' +
      '<textarea id="remarks" rows="2" maxlength="200"></textarea></div>' +
      '<div class="ver" id="ver"></div>';

    document.getElementById('rr').addEventListener('input', onRR);
    document.getElementById('acct').addEventListener('input', onRR);
    if (r.version) document.getElementById('ver').textContent = 'Meter Register ' + r.version;

    var sel = document.getElementById('status');
    statusList.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s; o.textContent = s;
      sel.appendChild(o);
    });
    sel.value = statusList[0]; // first value in the sheet = default
    extraLists.forEach(function (d) {
      var es = document.getElementById('cfg_' + normKey(d.header));
      if (!es) return;
      d.values.forEach(function (v) {
        var o = document.createElement('option');
        o.value = v; o.textContent = v;
        es.appendChild(o);
      });
    });
    document.getElementById('btn').style.display = 'block';
    renderQ();
  }

  function failBoot(e) {
    document.getElementById('loading').textContent =
      'Could not reach server' + (navigator.onLine ? '' : ' (offline)') +
      '. Reconnect and reload.';
  }

  function bInputs(pre, n) {
    var s = '';
    for (var i = 1; i <= n; i++)
      s += '<div><label>B' + i + '</label>' +
           '<input type="number" step="0.01" min="0" inputmode="decimal" id="' + pre + i + '"></div>';
    return s;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // matches the server-side normalizeKey_(): letters/digits only, lowercased
  function normKey(s) { return String(s || '').replace(/[^a-z0-9]/gi, '').toLowerCase(); }

  function onRR() {
    var rrV = document.getElementById('rr').value.trim();
    var acV = document.getElementById('acct').value.trim();
    var m = (rrV && METERS[normKey(rrV)]) || (acV && METERS[normKey(acV)]) || null;
    var box = document.getElementById('meterInfo');
    if (!m) { box.style.display = 'none'; return; }
    box.textContent = 'Name: ' + (m.name || '—') + ' · Acct: ' + (m.accountId || '—') +
      ' · MRID: ' + (m.mrid || '—') + '\n' +
      'Make: ' + (m.make || '—') + ' · S.No: ' + (m.serial || '—') +
      '\nConstant: ' + (m.constant || '—') + ' · Phases: ' + (m.phases || '—') +
      ' · MD DAY: ' + (m.mdDay || '—') + ' · SF: ' + (m.sf || '—') +
      (m.dtc || m.feeder || m.spot ? '\nDTC: ' + (m.dtc || '—') +
        ' · Feeder: ' + (m.feeder || '—') + ' · Location: ' + (m.spot || '—') : '');
    box.style.whiteSpace = 'pre-line';
    box.style.display = 'block';
    // pre-fill the optional meter-details section from Master (overwrites when
    // the resolved meter changes; leaves the inspector's own edits alone)
    if (lastMeter !== m.rr) {
      lastMeter = m.rr;
      setVal('mdConstant', m.constant, true); setVal('mdMake', m.make, true);
      setVal('mdSerial', m.serial, true); setVal('mdPhases', m.phases, true);
      setVal('mdDtc', m.dtc, true); setVal('mdFeeder', m.feeder, true);
      setVal('mdLocation', m.spot, true);
    }
  }

  var lastMeter = null;

  function setVal(id, v, force) {
    var el = document.getElementById(id);
    if (el && (force || !el.value)) el.value = v || '';
  }

  /* ---------- submit ---------- */
  function onSubmit() {
    if (submitting) return;
    var p = collect();
    if (!p) return;

    if (!navigator.onLine) {
      enqueue(p);
      toast('Saved on phone ✓ will send automatically — form cleared for next entry', true);
      resetReadings();
      return;
    }

    submitting = true; btn(true);
    google.script.run
      .withSuccessHandler(function (r) {
        submitting = false; btn(false);
        if (r && r.ok) {
          toast('Saved ✓ row ' + r.row + ' (' + r.month + ') — form cleared for next entry' +
                (r.warnings.length ? ' ⚠ ' + r.warnings.join(' · ') : '') +
                (r.capacity ? ' ⚠ ' + r.capacity : ''), !(r.warnings.length || r.capacityCritical));
          resetReadings();
        } else toast((r && r.error) || 'Failed', false);
      })
      .withFailureHandler(function (e) {
        submitting = false; btn(false);
        toast('Send failed: ' + e.message + ' — saved on phone, form cleared', true);
        enqueue(p);
        resetReadings();
      })
      .submitEntry(p);
  }

  function collect() {
    var g = function (id) { return document.getElementById(id).value.trim(); };
    var p = {
      date: g('date'), time: g('time'),
      rr: g('rr'), accountId: g('acct'), ckwh: g('ckwh'), prk: g('prk'),
      pf: g('pf'), status: g('status'), remarks: g('remarks'),
      meterDetails: {
        constant: g('mdConstant'), make: g('mdMake'), serial: g('mdSerial'),
        phases: g('mdPhases'), dtc: g('mdDtc'), feeder: g('mdFeeder'),
        location: g('mdLocation')
      },
      blocksKwh: [], bkw: []
    };
    for (var i = 1; i <= 6; i++) {
      p.blocksKwh.push(g('bk' + i));
      p.bkw.push(g('bw' + i));
    }
    // extra config dropdowns (Configuration tab columns) - header: value
    var config = {};
    Object.keys(CONFIG_LISTS).forEach(function (h) {
      if (h === 'Meter Status') return;
      var el = document.getElementById('cfg_' + normKey(h));
      if (el && el.value) config[h] = el.value;
    });
    if (Object.keys(config).length) p.config = config;
    if (!p.date)   return err('Date is required');
    if (!p.time)   return err('Time is required');
    if (!p.rr && !p.accountId) return err('Enter RR Number or Account ID');
    if (p.ckwh === '') return err('CKWh reading is required');
    if (p.prk === '')  return err('Pr kW reading is required');
    if (IS_GUEST) {
      var gEl = document.getElementById('guestName');
      if (gEl) p.guestName = gEl.value.trim();
      if (!p.guestName) return err('Enter your name — you are not in the Team list yet');
      if (/[{}]/.test(p.guestName)) return err('Name cannot contain { or }');
    }
    return p;
  }

  function err(msg) { toast(msg, false); return null; }
  function btn(d) { document.getElementById('btn').disabled = d; }

  // clears every input for the next inspection; Date/Time re-prefilled to now
  function resetReadings() {
    ['ckwh','prk','pf','remarks','rr','acct','mdConstant','mdMake','mdSerial','mdPhases','mdDtc','mdFeeder','mdLocation']
      .forEach(function (id) { document.getElementById(id).value = ''; });
    var st = document.getElementById('status');
    if (st && st.options.length) st.value = st.options[0].value; // sheet default
    lastMeter = null;
    // extra config dropdowns back to their "—" placeholder
    Object.keys(CONFIG_LISTS).forEach(function (h) {
      if (h === 'Meter Status') return;
      var el = document.getElementById('cfg_' + normKey(h));
      if (el) el.value = '';
    });
    for (var i = 1; i <= 6; i++) {
      document.getElementById('bk' + i).value = '';
      document.getElementById('bw' + i).value = '';
    }
    var n = new Date();
    document.getElementById('date').value = localISO(n);
    document.getElementById('time').value = pad(n.getHours()) + ':' + pad(n.getMinutes());
    document.getElementById('meterInfo').style.display = 'none';
  }

  /* ---------- offline queue ---------- */
  var QFKEY = 'mrq_failed_v1';
  function qGet() { try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch (e) { return []; } }
  function qSet(q) { localStorage.setItem(QKEY, JSON.stringify(q)); renderQ(); }
  function qFailGet() { try { return JSON.parse(localStorage.getItem(QFKEY)) || []; } catch (e) { return []; } }
  function qFailSet(q) { localStorage.setItem(QFKEY, JSON.stringify(q)); renderQ(); }

  function enqueue(p) { var q = qGet(); q.push({ at: new Date().toISOString(), p: p }); qSet(q); }

  // send failed entries first (manual retry via bar tap), then the live queue.
  // a server-REJECTED entry is parked in the failed list so it never blocks
  // the rest of the queue (poison pill), and is visible in the yellow bar.
  function syncQueue(retryFailed) {
    if (!navigator.onLine || submitting) return;
    if (retryFailed) {
      var fq = qFailGet();
      if (fq.length) { qFailSet(fq.slice(1).concat(qGet())); qSet([]); }
    }
    var q = qGet();
    if (!q.length) return;
    submitting = true;
    var item = q[0];
    google.script.run
      .withSuccessHandler(function (r) {
        submitting = false;
        if (r && r.ok) {
          q.shift(); qSet(q);
          toast('Sent 1 saved entry ✓', true);
          if (q.length) syncQueue();
        } else {
          var bad = q.shift(); // park the rejected entry — don't block the rest
          qSet(q);
          var fq = qFailGet();
          fq.push({ at: new Date().toISOString(), p: bad.p, why: (r && r.error) || 'rejected' });
          qFailSet(fq);
          toast('Rejected: ' + ((r && r.error) || 'saved separately'), false);
          if (q.length) syncQueue();
        }
      })
      .withFailureHandler(function () { submitting = false; }) // still offline - retry later
      .submitEntry(item.p);
  }

  function tick() { refreshNetBadge(); syncQueue(); }

  function renderQ() {
    var q = qGet(), fq = qFailGet(), bar = document.getElementById('queueBar');
    var total = q.length + fq.length;
    bar.style.display = total ? 'block' : 'none';
    document.getElementById('qCount').textContent = q.length + (fq.length ? '+' + fq.length + ' held' : '');
    var note = document.getElementById('failedNote');
    note.style.display = fq.length ? 'inline' : 'none';
    document.getElementById('fCount').textContent = fq.length;
  }

  /* ---------- misc ---------- */
  function refreshNetBadge() {
    var el = document.getElementById('net');
    el.textContent = navigator.onLine ? 'online' : 'offline';
    el.className = 'chip ' + (navigator.onLine ? 'on' : 'off');
  }
  function updateNet() {}
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function localISO(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  var tTimer;
  function toast(msg, isOk) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isOk ? 't-ok' : 't-err';
    t.style.display = 'block';
    clearTimeout(tTimer);
    tTimer = setTimeout(function () { t.style.display = 'none'; }, isOk ? 4000 : 7000);
  }
</script>
</body>
</html>
